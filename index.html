<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Dirty Martini Tier List</title>
  <meta name="description" content="A running, opinionated ranking of dirty martinis — sorted from transcendent to pour-it-out." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="brine" aria-hidden="true"></div>

  <header class="masthead">
    <svg class="olive-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
      <ellipse cx="32" cy="34" rx="19" ry="22" class="olive-body" />
      <ellipse cx="25" cy="24" rx="6" ry="7" class="olive-sheen" />
      <circle cx="32" cy="16" r="7" class="olive-pimento" />
    </svg>
    <h1>The Dirty Martini<br /><em>Tier List</em></h1>
    <p class="lede">Every dirty martini worth remembering, judged on brine, balance, and the walk home — sorted from transcendent to pour-it-out.</p>
    <p class="tally" id="tally"></p>
  </header>

  <main id="board" class="board"></main>

  <footer class="colophon">
    <svg class="olive-mark olive-mark--small" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
      <ellipse cx="32" cy="34" rx="19" ry="22" class="olive-body" />
      <ellipse cx="25" cy="24" rx="6" ry="7" class="olive-sheen" />
      <circle cx="32" cy="16" r="7" class="olive-pimento" />
    </svg>
    <p>Rankings are subjective, briny, and final. Three-olive minimum.</p>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
